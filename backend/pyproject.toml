[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Migrations são geradas pelo autogenerate do Alembic. Reformatá-las na mão
# introduz risco sem benefício -- o que importa nelas é o SQL, não o estilo.
"alembic/versions/*.py" = ["E501", "I001"]
