name: albion-economy

services:
  postgres:
    image: postgres:17-alpine
    container_name: albion-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-albion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-albion}
      POSTGRES_DB: ${POSTGRES_DB:-albion}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-albion} -d ${POSTGRES_DB:-albion}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: albion-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    container_name: albion-backend
    env_file: .env
    environment:
      # Dentro da rede do compose os hosts são os nomes dos serviços, não localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-albion}:${POSTGRES_PASSWORD:-albion}@postgres:5432/${POSTGRES_DB:-albion}
      REDIS_URL: redis://redis:6379/0
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-albion}:${POSTGRES_PASSWORD:-albion}@postgres:5432/${POSTGRES_DB:-albion}_test
      TEST_REDIS_URL: redis://redis:6379/15
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/srv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: albion-frontend
    env_file: .env
    environment:
      # Variáveis de servidor: nenhuma chega ao browser (sem prefixo NEXT_PUBLIC_).
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
      # Bind mount no Windows não propaga evento de inotify: o dev server não
      # recompila arquivo alterado, e rota nova chega a devolver 404 até alguém
      # reiniciar o container.
      #
      # MEDIDO EM 16/09/2026: estas duas variáveis NÃO resolveram o caso. Elas
      # são do webpack (watchpack) e do chokidar, e este projeto roda Next 16
      # com Turbopack, cujo watcher não as lê. Duas medições de ~2 min cada, com
      # o arquivo alterado e visível dentro do container, não produziram nenhuma
      # recompilação. `watchOptions.pollIntervalMs` no next.config, que é a
      # opção nativa do Turbopack, também não resolveu.
      #
      # Ficam porque não custam nada e voltam a valer se o projeto sair do
      # Turbopack. O que funciona hoje é reiniciar o serviço frontend.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/srv
      - /srv/node_modules
      - /srv/.next
    depends_on:
      backend:
        condition: service_started

  # Coleta é processo longo: mantém cursor, janela de rate limit e backoff.
  # Por isso vive num container próprio e nunca numa função serverless
  # (docs/00-arquitetura.md §3). Suba com:
  #   docker compose --profile collector up -d worker-market
  worker-market:
    profiles: ["collector"]
    build:
      context: ./backend
      target: dev
    container_name: albion-worker-market
    command:
      - python
      - -m
      - app.cli.collect_market
      - --server
      - ${COLLECTOR_SERVER:-west}
      - --loop
      - --interval
      - ${COLLECTOR_INTERVAL_SECONDS:-900}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-albion}:${POSTGRES_PASSWORD:-albion}@postgres:5432/${POSTGRES_DB:-albion}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/srv
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
